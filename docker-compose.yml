services:
  frontend:
    build: ./frontend
    container_name: kmi-frontend
    restart: unless-stopped
    ports:
      - "3050:3000"
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://100.84.97.16:3050}
    volumes:
      - ./config:/app/config:ro
    depends_on:
      - backend
    networks:
      - kmi-net

  backend:
    build: ./backend
    container_name: kmi-backend
    restart: unless-stopped
    ports:
      - "8050:8000"
    env_file:
      - .env
    environment:
      KMI_DB_PATH: ${KMI_DB_PATH:-/app/data/kmi_portal.db}
      KICKER_SCOUT_DB_PATH: ${KICKER_SCOUT_DB_PATH:-}
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    networks:
      - kmi-net

networks:
  kmi-net:
    driver: bridge
